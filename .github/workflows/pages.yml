name: Deploy Godot to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version
        shell: bash
        run: |
          printf 'class_name BuildVersion\n\nconst BRANCH := "%s"\nconst COMMIT := "%s"\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA::7}" > version.gd
      - name: Install web export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable /github/home/.local/share/godot/export_templates/
      - name: Fetch Kenney Top-down Shooter sprites
        run: |
          apt-get update -qq && apt-get install -y -qq curl
          curl -L "https://opengameart.org/sites/default/files/topdown-shooter.zip" -o /tmp/kenney.zip
          mkdir -p /tmp/kenney assets/kenney
          unzip -q /tmp/kenney.zip -d /tmp/kenney
          find /tmp/kenney -type f -name manBlue_gun.png -exec cp {} assets/kenney/survivor.png \;
          find /tmp/kenney -type f -name manBrown_hold.png -exec cp {} assets/kenney/baseball.png \;
          find /tmp/kenney -type f -name soldier1_machine.png -exec cp {} assets/kenney/soldier.png \;
          find /tmp/kenney -type f -name womanGreen_silencer.png -exec cp {} assets/kenney/scout.png \;
          find /tmp/kenney -type f -name zoimbie1_stand.png -exec cp {} assets/kenney/zombie.png \;
          find /tmp/kenney -type f -path "*/Tiles/tile_01.png" -exec cp {} assets/kenney/grass.png \;
          find /tmp/kenney -type f -path "*/Tiles/tile_28.png" -exec cp {} assets/kenney/road.png \;
          find /tmp/kenney -type f -path "*/Tiles/tile_271.png" -exec cp {} assets/kenney/sidewalk.png \;
          find /tmp/kenney -type f -path "*/Tiles/tile_183.png" -exec cp {} assets/kenney/tree.png \;
          find /tmp/kenney -type f -path "*/Tiles/tile_215.png" -exec cp {} assets/kenney/manhole.png \;
          find /tmp/kenney -type f -path "*/Tiles/tile_292.png" -exec cp {} assets/kenney/debris.png \;
          find /tmp/kenney -type f -path "*/Tiles/tile_320.png" -exec cp {} assets/kenney/oil_spill.png \;
          curl -L "https://raw.githubusercontent.com/eturner58/game-assets/main/kenney/2D%20assets/Racing%20Pack/PNG/Cars/car_black_1.png" -o assets/kenney/car.png
          test -f assets/kenney/survivor.png
          test -f assets/kenney/baseball.png
          test -f assets/kenney/soldier.png
          test -f assets/kenney/scout.png
          test -f assets/kenney/zombie.png
          test -f assets/kenney/grass.png
          test -f assets/kenney/road.png
          test -f assets/kenney/sidewalk.png
          test -f assets/kenney/tree.png
          test -f assets/kenney/manhole.png
          test -f assets/kenney/debris.png
          test -f assets/kenney/oil_spill.png
          test -f assets/kenney/car.png
      - name: Import Godot project
        run: godot --headless --editor --path . --quit
      - name: Smoke test active gameplay
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 2>&1 | tee /tmp/godot-smoke.log
          if grep -E "SCRIPT ERROR|Failed to load script" /tmp/godot-smoke.log; then
            exit 1
          fi
      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
