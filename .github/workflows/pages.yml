name: Deploy Godot to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version
        shell: bash
        run: |
          printf 'class_name BuildVersion\n\nconst BRANCH := "%s"\nconst COMMIT := "%s"\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA::7}" > version.gd
      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
